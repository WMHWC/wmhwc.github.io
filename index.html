<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>업무 도구</title>
<script src="/lock.js?v=5"></script>
<style>
@font-face{font-family:"WandoCleansea";font-weight:400;src:url(/nameplate/fonts/cleanseaR.woff2) format("woff2")}
@font-face{font-family:"WandoCleansea";font-weight:700;src:url(/nameplate/fonts/cleanseaB.woff2) format("woff2")}
:root{--bg:#e9edf1;--panel:#fff;--ink:#1d2733;--muted:#4f5d6c;--line:#d3dae2;--accent:#1f5fa8;--soft:#f4f7fa}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"WandoCleansea","Malgun Gothic","맑은 고딕",sans-serif}
.home{max-width:860px;margin:0 auto;padding:36px 20px 80px}
h1{margin:0 0 6px;font-size:30px}
.sub{margin:0 0 22px;color:var(--muted);font-size:17px}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filt button{font:inherit;font-weight:700;font-size:18px;padding:10px 22px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.filt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
li{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px 20px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:15px;color:var(--muted)}
.tool{font-weight:700;font-size:15px;padding:3px 12px;border-radius:999px;color:#fff;background:#5d6b7a}
.tool.t명찰{background:#1f5fa8}.tool.t그래프{background:#b4541a}
.ver{font-weight:700;color:var(--ink)}
.new{font-size:13px;font-weight:700;color:#fff;background:#e03131;border-radius:999px;padding:2px 9px}
.txt{font-size:18px;line-height:1.65}

.tabs{display:flex;gap:10px;margin:0 0 20px;border-bottom:3px solid var(--line)}
.tabs button{font:inherit;font-weight:700;font-size:21px;padding:12px 26px;border:0;border-bottom:4px solid transparent;margin-bottom:-3px;background:none;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs .adm{margin:0 0 6px auto;align-self:center;font-size:15px;font-weight:700;padding:7px 14px;border-radius:10px;border:2px dashed var(--line);color:var(--muted)}
.tabs .adm.on{border-style:solid;border-color:#2b8a3e;color:#2b8a3e}
.admbox{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-6px 0 16px;flex-wrap:wrap}
.admbox input{font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:180px;background:var(--panel);color:var(--ink)}
.admbox button{font:inherit;font-weight:700;font-size:17px;padding:9px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.admbox .err{color:#e03131;font-size:16px}
.det{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--soft);border-left:4px solid #2b8a3e;font-size:16px;line-height:1.6;color:var(--ink);white-space:pre-line}
.det b{color:#2b8a3e}
.ready{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:34px 24px;text-align:center}
.ready .big{font-size:24px;font-weight:700;margin:0 0 10px}
.ready p{font-size:18px;color:var(--muted);margin:6px 0;line-height:1.6}
</style></head><body>
<main class="home">
 <h1>홈</h1>
 <div class="tabs" id="tabs">
  <button type="button" class="on" data-p="up">📢 업데이트</button>
  <button type="button" data-p="ask">💬 문의</button>
  <button type="button" data-p="adm" id="admTab" hidden>🔧 관리자 기록</button>
  <button type="button" class="adm" id="admBtn">🔒 관리자</button>
 </div>

 <section id="p-up">
  <form class="admbox" id="admBox" hidden>
   <input type="password" id="admPw" placeholder="관리자 비밀번호" autocomplete="off">
   <button type="submit">확인</button>
   <span class="err" id="admErr"></span>
  </form>
  <ul id="list"><li>불러오는 중…</li></ul>
 </section>

 <section id="p-adm" hidden>
  <div class="filt" id="filt"></div>
  <ul id="alist"><li>불러오는 중…</li></ul>
 </section>

 <section id="p-ask" hidden>
  <div class="ready">
   <p class="big">💬 문의는 준비 중이에요</p>
   <p>불편한 점이나 바라는 점을 남길 수 있는 곳이 곧 생겨요.</p>
   <p>그 전까지는 만든 사람에게 직접 말해주세요.</p>
  </div>
 </section>
</main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=d=>{const m=/^(\d+)-(\d+)-(\d+)$/.exec(d||'');return m?`${+m[1]}년 ${+m[2]}월 ${+m[3]}일`:d||''};
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}};
const ADM='3ba447072b1bcb90321f2ed1d549832955a19dacb57c4c068f9f6367c6387ff0';
const $=id=>document.getElementById(id);
let UP=[],AU=null,cur='전체',admin=ss('wmhwc_admin')==='1';

function show(p){document.querySelectorAll('#tabs button[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  ['up','ask','adm'].forEach(k=>$('p-'+k).hidden=k!==p)}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(b)show(b.dataset.p)});

/* 전체 공개 업데이트 */
function drawPub(){
  $('list').innerHTML=UP.map((u,i)=>`<li><div class="meta"><span class="ver">v${esc(u.버전)}</span><span>${nice(u.날짜)}</span>${i===0?'<span class="new">NEW</span>':''}</div><div class="txt">${esc(u.내용)}</div></li>`).join('')||'<li>아직 없어요.</li>';
  const ab=$('admBtn');ab.classList.toggle('on',admin);ab.textContent=admin?'🔓 관리자 나가기':'🔒 관리자';
  $('admTab').hidden=!admin;
}
/* 관리자 기록 (따로 파일) */
function drawAdm(){
  if(!AU){fetch('/admin-updates.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{AU=j;drawAdm()}).catch(()=>{$('alist').innerHTML='<li>못 불러왔어요.</li>'});return}
  $('filt').innerHTML=['전체','공통','명찰','그래프'].map(t=>`<button type="button" class="${t===cur?'on':''}" data-t="${t}">${t}</button>`).join('');
  $('alist').innerHTML=AU.filter(u=>cur==='전체'||u.도구===cur).map(u=>`<li><div class="meta"><span class="tool t${esc(u.도구)}">${esc(u.도구)}</span>${u.버전?`<span class="ver">v${esc(u.버전)}</span>`:''}<span>${nice(u.날짜)}</span></div><div class="txt">${esc(u.내용)}</div>${u.자세히?`<div class="det"><b>자세히</b>\n${esc(u.자세히)}</div>`:''}</li>`).join('')||'<li>없어요.</li>';
}
$('filt').addEventListener('click',e=>{const b=e.target.closest('button');if(b){cur=b.dataset.t;drawAdm()}});
$('admBtn').addEventListener('click',()=>{
  if(admin){admin=false;ss('wmhwc_admin',null);show('up');drawPub();return}
  const f=$('admBox');f.hidden=!f.hidden;if(!f.hidden)$('admPw').focus()});
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
$('admBox').addEventListener('submit',async e=>{e.preventDefault();const p=$('admPw');
  if(await sha(p.value)===ADM){admin=true;ss('wmhwc_admin','1');p.value='';$('admErr').textContent='';$('admBox').hidden=true;drawPub();drawAdm();show('adm')}
  else{$('admErr').textContent='비밀번호가 달라요';p.select()}});
fetch('/updates.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{UP=j;drawPub();if(admin)drawAdm()}).catch(()=>{$('list').innerHTML='<li>업데이트 소식을 못 불러왔어요. 새로고침 해주세요.</li>'});
</script>
</body></html>
