<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>업무 도구</title>
<script src="/lock.js?v=3"></script>
<style>
@font-face{font-family:"WandoCleansea";font-weight:400;src:url(/nameplate/fonts/cleanseaR.woff2) format("woff2")}
@font-face{font-family:"WandoCleansea";font-weight:700;src:url(/nameplate/fonts/cleanseaB.woff2) format("woff2")}
:root{--bg:#e9edf1;--panel:#fff;--ink:#1d2733;--muted:#5d6b7a;--line:#d3dae2;--accent:#1f5fa8;--soft:#f4f7fa}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"WandoCleansea","Malgun Gothic","맑은 고딕",sans-serif}
.home{max-width:760px;margin:0 auto;padding:56px 20px}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 0 28px;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;padding:22px 20px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{font-size:34px;line-height:1}
.card b{font-size:19px}
.card span{font-size:14px;color:var(--muted);line-height:1.5}
.card.soon{opacity:.6;pointer-events:none}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;color:#c2410c;background:#fff4e6;border-radius:999px;padding:2px 9px}
</style></head><body>
<main class="home" id="app">
 <h1>업무 도구</h1>
 <p class="sub">쓸 도구를 눌러주세요.</p>
 <div class="grid">
  <a class="card" href="/nameplate/"><div class="ic">🏷️</div><b>명찰 만들기</b><span>계절 배경 명찰, 뒷면 비상연락망</span></a>
  <a class="card" href="/report/"><div class="ic">📊</div><b>결과보고 그래프</b><span>사전·사후, 만족도, 성별 그래프를 만들고 한글 파일에 넣어요</span></a>
 </div>
</main>
</body></html>
